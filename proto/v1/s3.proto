syntax = 'proto3';

package beget.cloud.v1.s3;
import "google/api/annotations.proto";

// Управление S3
//
// Предоставляет набор методов для работы с S3 хранилищем.
service S3Service {
    // Получить информацию о квоте
    //
    // Возращает количество доступной квоты в рамках подписки, а также общее количество использованной квоты.
    rpc getQuota(GetQuotaRequest) returns (GetQuotaResponse) {
        option (google.api.http) = {
            get: "/v1/cloud/s3/quota",
        };
    }

    // Изменить ключи доступа к бакету
    //
    // Меняет ключи доступа к бакету.
    //
    // Для получения доступных идентификаторов сервисов `service_id` необходимо использовать метод
    // "Получить информацию о сервисах" из API "Управляемые сервисы" -> "Управление сервисами".
    rpc changeAccessKey(ChangeAccessKeyRequest) returns (ChangeAccessKeyResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/{service_id}/access-key",
            body: "*"
        };
    }

    // Изменить политику доступа(CORS) бакета
    //
    // Меняет политику доступа(CORS) бакета.
    // Для получения доступных идентификаторов сервисов `service_id` необходимо использовать метод
    // "Получить информацию о сервисах" из API "Управляемые сервисы" -> "Управление сервисами".
    rpc changeCors(ChangeCorsRequest) returns (ChangeCorsResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/{service_id}/cors",
            body: "*"
        };
    }

    // Изменить доменое имя для доступа к бакету
    //
    // Меняет доменное имя для доступа к бакету.
    //
    // Для получения доступных идентификаторов сервисов `service_id` необходимо использовать метод
    // "Получить информацию о сервисах" из API "Управляемые сервисы" -> "Управление сервисами".
    rpc changeDomain(ChangeDomainRequest) returns (ChangeDomainResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/{service_id}/domain",
            body: "*"
        };
    }

    // Изменить тип доступа к бакету(публичный/приватный)
    //
    // Меняет тип доступа к бакету - без авторизации, либо с авторизацией по ключам.
    //
    // Для получения доступных идентификаторов сервисов `service_id` необходимо использовать метод
    // "Получить информацию о сервисах" из API "Управляемые сервисы" -> "Управление сервисами".
    rpc changePublic(ChangePublicRequest) returns (ChangePublicResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/{service_id}/public",
            body: "*"
        };
    }

    // Узнать тарификацию облачного хранилища S3
    //
    // Возвращает стоимость услуги в день и количество используемых GB.
    rpc getPrice(GetPriceRequest) returns (GetPriceResponse) {
        option (google.api.http) = {
            get: "/v1/cloud/s3/price",
        };
    }

    // Узнать префикс имени бакета
    //
    // Возвращает префикс имени бакета, который будет использован при создании бакета.
    rpc getPrefix(GetPrefixRequest) returns (GetPrefixResponse) {
        option (google.api.http) = {
            get: "/v1/cloud/s3/prefix",
        };
    }

    // Включить/выключить доступ к бакету по FTP и SFTP
    rpc enableFtp(EnableFtpRequest) returns (EnableFtpResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/{service_id}/enable-ftp",
            body: "*"
        };
    }

    // Получить список пользователей S3
    //
    // Возвращает список пользователей S3.
    //
    rpc getUsers(GetUsersRequest) returns (GetUsersResponse) {
        option (google.api.http) = {
            get: "/v1/cloud/s3/users",
        };
    }

    // Создать пользователя S3
    //
    // Создаёт пользователя S3.
    //
    rpc createUser(CreateUserRequest) returns (CreateUserResponse) {
        option (google.api.http) = {
            post: "/v1/cloud/s3/user",
            body: "*"
        };
    }

    // Обновить информацию о пользователе S3
    //
    // Обновляет информацию о пользователе S3, описание и статус(заблокировн/разблокирован).
    //
    rpc updateUser(UpdateUserRequest) returns (UpdateUserResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/user/{username}",
            body: "*"
        };
    }

    // Изменить статус блокировки пользователя S3
    //
    // Изменяет статус блокировки пользователя S3.
    //
    rpc setUserBlocked(SetUserBlockedRequest) returns (SetUserBlockedResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/user/{username}/blocked"
            body: "*"
        };
    }

    // Удалить пользователя S3
    //
    // Удаляет пользователя S3.
    //
    rpc deleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
        option (google.api.http) = {
            delete: "/v1/cloud/s3/user/{username}",
        };
    }

    // Прикрепить пользователя S3 к бакету
    //
    // Прикрепляет пользователя S3 к бакету.
    //
    rpc attachUser(AttachUserRequest) returns (AttachUserResponse) {
        option (google.api.http) = {
            post: "/v1/cloud/s3/user/{username}/attach",
            body: "*"
        };
    }

    // Открепить пользователя S3 от бакета
    //
    // Открепляет пользователя S3 от бакета.
    //
    rpc detachUser(DetachUserRequest) returns (DetachUserResponse) {
        option (google.api.http) = {
            post: "/v1/cloud/s3/user/{username}/detach",
            body: "*"
        };
    }

    // Сменить права доступа пользователя S3 к бакету
    //
    // Меняет права доступа пользователя S3 к бакету.
    //
    rpc updateUserPermissions(UpdateUserPermissionsRequest) returns (UpdateUserPermissionsResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/user/{username}/permissions",
            body: "*"
        };
    }

    // Изменить ключи доступа пользователя
    //
    // Меняет ключи доступа пользователя.
    //
    rpc userChangeAccessKey(UserChangeAccessKeyRequest) returns (UserChangeAccessKeyResponse) {
        option (google.api.http) = {
            patch: "/v1/cloud/s3/user/{username}/access-key",
            body: "*"
        };
    }
}

message GetUsersRequest {
    // Смещение для пагинации
    int32 offset = 1;

    // Лимит записей для пагинации (от 1 до 9999)
    int32 limit = 2;

    // Сортировка списка S3 пользователей
    string sort = 3;

    // Фильтр для выборки S3 пользователей
    string filter = 4;
}

message GetUsersResponse {
    repeated S3User user = 1;

    // Общее количество пользователей
    uint32 total_count = 2;
}

message CreateUserRequest {
    string username = 1;
    string description = 2;
    repeated BucketAccess bucket_access = 3;

    message BucketAccess {
        string bucket_service_id = 1;
        AccessType access_type = 2;
    }

    enum AccessType {
        READONLY = 0;
        READWRITE = 1;
        FULL = 2;
    }
}

message CreateUserResponse {
    // Результат запроса
    oneof result {
        // Результат запроса: информация о пользователе S3
        S3User user = 1;

        // Результат запроса: ошибка при создании пользователя S3
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Внутренняя ошибка
            INTERNAL_ERROR = 1;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 2;

            // Некорректное имя пользователЯ
            INVALID_USERNAME = 3;

            // Пользователь с таким именем уже существует
            USER_ALREADY_EXISTS = 4;

            // Некорректное описание пользователя
            INVALID_DESCRIPTION = 5;

            // S3 бакет не найден
            BUCKET_NOT_FOUND = 6;
        }
    }
}

message UpdateUserRequest {
    string username = 1;
    string description = 2;
}

message UpdateUserResponse {
    // Результат запроса
    oneof result {
        // Результат запроса: информация о пользователе S3
        S3User user = 1;

        // Результат запроса: ошибка при обновлении пользователя S3
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Внутренняя ошибка
            INTERNAL_ERROR = 1;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 2;

            // Пользователь не найден
            USER_NOT_FOUND = 3;

            // Некорректное описание пользователя
            INVALID_DESCRIPTION = 4;
        }
    }
}

message SetUserBlockedRequest {
    string username = 1;
    bool blocked = 2;
}

message SetUserBlockedResponse {
    // Результат запроса
    oneof result {
        // Результат запроса: информация о пользователе S3
        S3User user = 1;

        // Результат запроса: ошибка при изменении статуса блокировки пользователя S3
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Внутренняя ошибка
            INTERNAL_ERROR = 1;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 2;

            // Пользователь не найден
            USER_NOT_FOUND = 3;

            // Пользователь уже заблокирован
            USER_ALREADY_BLOCKED = 4;

            // Пользователь не заблокирован
            USER_ALREADY_UNBLOCKED = 5;
        }
    }
}

message DeleteUserRequest {
    string username = 1;
}

message DeleteUserResponse {
    // Результат запроса
    oneof result {
        // Результат запроса: успешное удаление пользователя S3
        Success success = 1;

        // Результат запроса: ошибка при удалении пользователя S3
        Error error = 2;
    }

    message Success {
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Внутренняя ошибка
            INTERNAL_ERROR = 1;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 2;

            // Пользователь не найден
            USER_NOT_FOUND = 3;
        }
    }
}

message AttachUserRequest {
    string username = 1;
    BucketAccess bucket_access = 3;

    message BucketAccess {
        string bucket_service_id = 1;
        AccessType access_type = 2;
    }

    enum AccessType {
        READONLY = 0;
        READWRITE = 1;
        FULL = 2;
    }
}

message AttachUserResponse {
    // Результат запроса
    oneof result {
        // Результат запроса: информация о пользователе S3
        S3User user = 1;

        // Результат запроса: ошибка при прикреплении пользователя S3 к бакету
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Внутренняя ошибка
            INTERNAL_ERROR = 1;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 2;

            // Пользователь не найден
            USER_NOT_FOUND = 3;

            // S3 бакет не найден
            BUCKET_NOT_FOUND = 4;
        }
    }
}

message DetachUserRequest {
    string username = 1;
    string bucket_service_id = 2;
}

message DetachUserResponse {
    // Результат запроса
    oneof result {
        // Результат запроса: информация о пользователе S3
        S3User user = 1;

        // Результат запроса: ошибка при откреплении пользователя S3 от бакета
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Внутренняя ошибка
            INTERNAL_ERROR = 1;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 2;

            // Пользователь не найден
            USER_NOT_FOUND = 3;

            // S3 бакет не найден
            BUCKET_NOT_FOUND = 4;
        }
    }
}

message UpdateUserPermissionsRequest {
    string username = 1;
    BucketAccess bucket_access = 3;

    message BucketAccess {
        string bucket_service_id = 1;
        AccessType access_type = 2;
    }

    enum AccessType {
        READONLY = 0;
        READWRITE = 1;
        FULL = 2;
    }
}

message UpdateUserPermissionsResponse {
    // Результат запроса
    oneof result {
        // Результат запроса: информация о пользователе S3
        S3User user = 1;

        // Результат запроса: ошибка при обновлении прав пользователя S3
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Внутренняя ошибка
            INTERNAL_ERROR = 1;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 2;

            // Пользователь не найден
            USER_NOT_FOUND = 3;

            // S3 бакет не найден
            BUCKET_NOT_FOUND = 4;
        }
    }
}

message UserChangeAccessKeyRequest {
    string username = 1;
}

message UserChangeAccessKeyResponse {
    // Результат запроса
    oneof result {
        // Результат запроса: информация о пользователе S3
        S3User user = 1;

        // Результат запроса: ошибка при смене ключей пользователя S3
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Внутренняя ошибка
            INTERNAL_ERROR = 1;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 2;

            // Пользователь не найден
            USER_NOT_FOUND = 3;
        }
    }
}

message S3User {
    string username = 1;
    string description = 2;
    // Дата создания пользователя в формате RFC3339
    string date_create = 3;
    bool is_admin = 4;
    string access_key = 5;
    string secret_key = 6;
    Status status = 7;
    Blocked blocked = 8;
    repeated BucketAccess bucket_access = 9;

    enum Status {
        CREATING = 0;
        CREATED = 1;
    }

    enum Blocked {
        NONE = 0;
        AUTO = 1;
        MANUAL = 2;
    }

    message BucketAccess {
        string bucket_service_id = 1;
        AccessType access_type = 2;
    }

    enum AccessType {
        READONLY = 0;
        READWRITE = 1;
        FULL = 2;
        CUSTOM = 3;
    }
}


message GetQuotaRequest {
}

message GetQuotaResponse {
    // Общее количество используемой квоты в MB
    uint32 used_size = 1;
}

message ChangeAccessKeyRequest {
    // Идентификатор сервиса в формате uuid v4
    string service_id = 1;
}

message ChangeAccessKeyResponse {
    oneof result {
        // Результат запроса: информация о сервисе
        S3 s3 = 1;

        // Результат запроса: ошибка при обновлении информации о сервисе
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 6;
        }
    }
}

message ChangeCorsRequest {
    // Идентификатор сервиса в формате uuid v4
    string service_id = 1;

    // Список политик доступа CORS
    repeated Cors cors = 2;
}

message ChangeCorsResponse {
    oneof result {
        // Результат запроса: информация о сервисе
        S3 s3 = 1;

        // Результат запроса: ошибка при обновлении информации о сервисе
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 3;

            // Некорректный домен
            INVALID_DOMAIN = 5;

            // Некорректный список HTTP методов
            INVALID_HTTP_METHODS = 6;

            // Некорректное значение cache_ttl
            INVALID_CACHE_TTL = 7;

            // Некорректный список заголовков Access-Control-Allow-Headers
            INVALID_ALLOW_HEADERS = 8;

            // Некорректный список заголовков Access-Control-Expose-Headers
            INVALID_EXPOSE_HEADERS = 9;
        }
    }
}

message ChangeDomainRequest {
    // Идентификатор сервиса в формате uuid v4
    string service_id = 1;

    // Доменое имя третьего уровня
    string fqdn = 2;
}

message ChangeDomainResponse {
    oneof result {
        // Результат запроса: информация о сервисе
        S3 s3 = 1;

        // Результат запроса: ошибка при обновлении информации о сервисе
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        // Дополнительная информация о ошибке
        oneof details {
            DomainAlreadyUsedDetails domain_already_used_details = 3;
        }

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 3;

            // Домен не зарегистрирован
            DOMAIN_NOT_REGISTERED = 4;

            // У домена указаны NS сервера отличные от серверов Beget -
            // ns1.beget.com
            // ns2.beget.com
            // ns1.beget.pro
            // ns2.beget.pro
            DOMAIN_INCORRECT_NS = 5;

            // Домен не является доменом третьего уровня
            NOT_SUBDOMAIN = 6;

            // Домен не найден на аккаунте пользователя
            DOMAIN_NOT_FOUND = 7;

            // Домен уже используется другим сервисом
            DOMAIN_ALREADY_USED = 8;
        }

        message DomainAlreadyUsedDetails {
            string service_uuid = 1;
            ServiceType service_type = 2;

            enum ServiceType {
                _ = 0;
                CLOUD = 1;
            }
        }
    }
}

message ChangePublicRequest {
    // Идентификатор сервиса в формате uuid v4
    string service_id = 1;

    // Сделать бакет публичным/приватным
    bool public = 2;
}

message ChangePublicResponse {
    oneof result {
        // Результат запроса: информация о сервисе
        S3 s3 = 1;

        // Результат запроса: ошибка при обновлении информации о сервисе
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 3;
        }
    }
}

message EnableFtpRequest {
    // Идентификатор сервиса в формате uuid v4
    string service_id = 1;

    // Включить/выключить доступ
    bool enable = 2;
}

message EnableFtpResponse {
    oneof result {
        // Результат запроса: информация о сервисе
        S3 s3 = 1;

        // Результат запроса: ошибка при обновлении информации о сервисе
        Error error = 2;
    }

    message Error {
        // Описание ошибки
        string message = 1;

        // Код ошибки
        Code code = 2;

        enum Code {
            // Зарезервированный код ошибки
            _ = 0;

            // Доступ к сервису заблокирован
            SERVICE_DISABLED = 3;
        }
    }
}

message GetPriceRequest {
}

message GetPriceResponse {
    repeated Bucket bucket = 5;

    message Bucket {
        // Имя бакета
        string name = 1;

        // Имя бакета для отображения
        string display_name = 2;

        // Объем данных в хранилище в Мб (максимальный за день)
        uint32 storage_size = 3;

        // Стоимость хранения данных в день
        double storage_rate = 4;

        // Использование трафика за день в Мб
        uint32 traffic_amount = 5;

        // Стоимость использованного трафика за день
        double traffic_rate = 6;
    }
}

message GetPrefixRequest {
}

message GetPrefixResponse {
    string prefix = 1;
}

message S3CreateParams {
    // Признак публичности репозитория
    bool public = 1;

    // Имя бакета, может содержать только латинские символы, цифры и знак `-`, при этом символ `-` не может быть в начале или конце названия или повторяться два раза подряд
    string bucket_name = 2;
}

message S3CreateError {
    // Описание ошибки
    string message = 1;

    // Код ошибки
    Code code = 2;

    enum Code {
        // Зарезервированный код ошибки
        _ = 0;

        // Недостаточно средств для создания сервиса
        INSUFFICIENT_FUNDS = 1;

        // Неизвестная конфигурация
        CONFIGURATION_NOT_FOUND = 2;

        // Некорректное название сервиса
        INVALID_DISPLAY_NAME = 4;

        // Бакет с таким именем уже существует
        BUCKET_NAME_ALREADY_EXISTS = 8;

        // Некорректное уникальное имя бакета
        INVALID_BUCKET_NAME = 9;

        // Создано максимально доступное количество бакетов
        BUCKET_LIMIT_REACHED = 10;

        // Некорректное описание бакета
        INVALID_DESCRIPTION = 11;

        // Проект не найден или недоступен
        PROJECT_NOT_FOUND = 12;

        // Создание недоступно
        SERVICE_DISABLED = 13;
    }
}

message S3 {
    // Признак публичности бакета
    bool public = 1;

    // Имя пользователя для доступа к бакету
    string access_key = 2;

    // Пароль для доступа к бакету
    string secret_key = 3;

    // Доменое имя для доступа к бакету
    string fqdn = 4;

    // Политики доступа CORS
    repeated Cors cors = 5;

    // Используемая квота в MB
    uint32 quota_used_size = 6;

    // Данные о FTP доступе
    Ftp ftp = 7;

    // Данные о SFTP доступе
    Sftp sftp = 8;

    // Данные о прикрепленном CDN
    Cdn attached_cdn = 9;

    message Cdn {
        // Идентификатор CDN сервиса в формате uuid v4
        string service_id = 1;

        // Имя CDN сервиса
        string service_display_name = 2;

        // Имя CDN сервиса, для отображения в URL
        string service_slug = 3;
    }
}

message Ftp {
    string host = 1;
    uint32 port = 2;
    string login = 3;
    string password = 4;
    Status status = 5;

    enum Status {
        ENABLED = 0;
        DISABLED = 1;
        BLOCKED = 2;
    }
}

message Sftp {
    string host = 1;
    uint32 port = 2;
    string login = 3;
    string password = 4;
    Status status = 5;

    enum Status {
        ENABLED = 0;
        DISABLED = 1;
        BLOCKED = 2;
    }
}

message Cors {
    // Идентификатор политики доступа (необязательное поле при создании CORS)
    uint32 id = 1;

    // Список HTTP методов, доступны - GET/POST/PUT/DELETE/HEAD
    repeated string http_method = 2;

    // Список HTTP заголовков разрешенных в запросе к объекту
    repeated string access_control_allow_headers = 3;

    // Список HTTP заголовков доступных клиенту при обработке ответа сервера
    repeated string access_control_expose_headers = 6;

    // Время кеширования CORS для браузера
    uint64 cache_ttl = 4;

    // Домен для которого будет разрешен доступ к хранилищу
    string fqdn = 5;
}

message S3Configuration {
    // Бесплатное количество трафика в месяц в Мб
    uint32 free_traffic_amount = 4;

    // Стоимость за один гигабайт трафика в день
    double traffic_price_day = 5;

    // Стоимость за один гигабайт трафика в месяц
    double traffic_price_month = 6;
}